# This repository's mark: how it fits the Open Commons Observatory's picture.
schema = 1

[project]
id = "linux-phone-oco/device-template"
name = "Device template: a new phone's lab is a new device.toml"
title = "device template"
kind = "device-lab"
parent = "linux-phone-oco"

# This device base's own tables (tables.toml, data/): its queue, tries, measurements, decisions, research and parts.
# What helps every device is in linux-phone-oco/docs, which pulls this base's parts (devicebase.toml).
# Decided 2026-11-17: docs' decision 2026-11-17-commons-and-device-bases.
[exports]
backlog = "data/backlog.json"
decisions = "data/decisions.json"
research = "data/research.json"
session_log = "data/session_log.json"
parts = "data/parts.json"
test_runs = "data/test_runs.json"
